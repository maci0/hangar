name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repo contents.
permissions:
  contents: read

# Supersede in-flight runs for the same ref instead of running them in parallel.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Zig 0.16.0
        # v2.2.1: v1 fetches zig-linux-x86_64-*.tar.xz, which 404s for 0.16.0
        # (tarball names flipped to zig-x86_64-linux-* in 0.14.1).
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Cache Zig build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .zig-cache
          key: zig-cache-${{ runner.os }}-${{ hashFiles('build.zig.zon', 'build.zig') }}-${{ github.sha }}
          restore-keys: |
            zig-cache-${{ runner.os }}-${{ hashFiles('build.zig.zon', 'build.zig') }}-
            zig-cache-${{ runner.os }}-
      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libvncserver-dev pkg-config shellcheck
          zig build
      - name: Static analysis (zig fmt + shellcheck + bun js syntax)
        run: |
          zig build fmt-check
          zig build lint-shell
          zig build lint-js
      - name: Hermetic unit + fuzz tests
        run: zig build test --summary all
