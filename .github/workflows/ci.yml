name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repo contents.
permissions:
  contents: read

# Supersede in-flight runs for the same ref instead of running them in parallel.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v1
        with:
          version: 0.16.0
      - name: Cache Zig build artifacts
        uses: actions/cache@v4
        with:
          path: .zig-cache
          key: zig-cache-${{ runner.os }}-${{ hashFiles('build.zig.zon', 'build.zig') }}-${{ github.sha }}
          restore-keys: |
            zig-cache-${{ runner.os }}-${{ hashFiles('build.zig.zon', 'build.zig') }}-
            zig-cache-${{ runner.os }}-
      - name: Build
        run: zig build
      - name: Hermetic unit + fuzz tests
        run: zig build test
