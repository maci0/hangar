<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Same mark as .sidebar-header .logo and the About dialog emblem: flat
       --accent fill, --radius corner, one accent-colored "H". Static, so the
       token is pinned to its light-theme value (reads on light and dark tab
       chrome alike) rather than resolved from a stylesheet. -->
  <rect width="32" height="32" rx="8" fill="#2a6496"/>
  <text x="16" y="22" text-anchor="middle" font-family="-apple-system,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">H</text>
</svg>
