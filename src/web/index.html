<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hangar: VM Manager</title>
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/ui.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
<a id="skip-link" href="#main-content">Skip to main content</a>


<!-- Connection-lost banner, sidebar head, bulk bar, VM header, status bar and toasts are Preact. -->
<div id="banner-root" class="contents"></div>

<!-- ═══ Sidebar ═══ -->
<aside id="sidebar" aria-label="VM Library">
  <div id="sidebar-head-root" class="contents"></div>
  <div id="vmlist" role="group" aria-label="VM Library">
    <div class="empty-state px-5 py-10 text-center">
      <p class="text-xs text-fg-dim">No VMs</p>
    </div>
  </div>
  <div id="bulk-root" class="contents"></div>
</aside>

<!-- ═══ Main Content ═══ -->
<main id="main-content" tabindex="-1">
  <h1 class="sr-only">Hangar VM Manager</h1>
  <!-- Toolbar -->
  <div id="toolbar-root" class="contents"></div>

  <!-- Content Area -->
  <div class="content-area">
    <!-- VM header + tab bar -->
    <div id="vmheader-root" class="contents"></div>

    <!-- Tab: Console -->
    <div id="tabConsole" class="hidden" role="tabpanel" aria-labelledby="tab-btn-console" aria-hidden="true">
    <div id="display" role="group" aria-label="VM console" aria-describedby="displayHint">
      <div class="display-badge" id="displayBadge" aria-hidden="true"></div>
      <div class="display-toolbar" role="toolbar" aria-label="Display controls">
        <button class="display-tool" data-action="enterDisplayOnly" data-vm-action="display" title="Display only" aria-label="Display only"><svg class="ico" aria-hidden="true"><use href="/icons.svg#i-maximize"/></svg></button>
        <button class="display-tool" data-action="reconnectDisplay" data-vm-action="display" title="Reconnect display" aria-label="Reconnect display"><svg class="ico" aria-hidden="true"><use href="/icons.svg#i-refresh"/></svg></button>
        <button class="display-tool" data-action="sendCad" data-vm-action="cad" title="Send Ctrl+Alt+Del" aria-label="Send Ctrl+Alt+Del"><svg class="ico" aria-hidden="true"><use href="/icons.svg#i-keyboard"/></svg></button>
      </div>
      <div id="displayHint" class="display-hint" aria-live="polite"></div>
    </div>
    <!-- Serial console panel -->
    <div id="serialpanel">
      <div id="serialStatus" role="status" aria-live="polite"></div>
      <div id="serialterm" role="group" aria-label="Serial console terminal"></div>
      <div class="serial-resize-handle" id="serialResize" role="separator" aria-orientation="horizontal" tabindex="0" aria-label="Resize serial console" aria-valuemin="60" aria-valuemax="600" aria-valuenow="240" title="Drag to resize"></div>
      <div class="serial-toolbar">
        <button class="btn" data-action="clearSerial">Clear</button>
        <button class="btn" data-action="exportSerial">Export</button>
        <span class="flex-1"></span>
        <button class="btn" data-action="manualDisconnectSerial">Disconnect</button>
      </div>
    </div>
      <div id="consoleHint" role="status" aria-live="polite"></div>
    </div>

    <!-- Tab: Summary -->
    <div id="tabSummary" role="tabpanel" aria-labelledby="tab-btn-summary" aria-hidden="false">
      <div class="empty-state">
        <svg class="empty-icon" aria-hidden="true"><use href="/icons.svg#i-monitor"/></svg>
        <h2>No Virtual Machine Selected</h2>
        <p>Select a VM from the sidebar, create a new virtual machine, import an existing disk, or use the catalog.</p>
        <div class="empty-actions">
          <button class="btn primary" data-action="newVm"><svg class="ico" aria-hidden="true"><use href="/icons.svg#i-plus"/></svg>New VM</button>
          <button class="btn" data-action="importGuest">Import VM</button>
          <button class="btn" data-action="openCatalog">Catalog</button>
        </div>
      </div>
    </div>

    <!-- Tab: Settings (hidden) -->
    <div id="tabSettings" class="hidden" role="tabpanel" aria-labelledby="tab-btn-settings" aria-hidden="true">
      <div class="empty-state">
        <svg class="empty-icon" aria-hidden="true"><use href="/icons.svg#i-gear"/></svg>
        <h2>No Virtual Machine Selected</h2>
        <p>Select a VM from the sidebar to edit its settings.</p>
      </div>
    </div>

    <!-- Migration progress bar -->
    <div id="mig_bar_container" class="mt-5">
      <div id="mig_progress" class="mb-1.5 hidden h-1 overflow-hidden rounded-xs bg-border" role="progressbar" aria-label="Migration progress" aria-valuemin="0" aria-valuemax="100">
        <div class="h-full w-0 rounded-xs bg-accent transition-all duration-300 ease-in-out"></div>
      </div>
      <span id="mig_pct" class="hidden text-xs text-fg-muted" role="status" aria-live="polite"></span>
      <button id="mig_cancel" class="btn danger ml-3 hidden px-2.5 py-0.75 text-caption" data-action="cancelMigrate">Cancel</button>
    </div>
  </div>
</main>

<!-- Status bar and its screen-reader announcer -->
<div id="statusbar-root" class="contents"></div>

<!-- Toasts and the context menu. The toast container is the live region and mounts before any toast. -->
<div id="overlay-root"></div>

<!-- Display-only overlay bar -->
<div class="displayonly-bar">
  <span>Display-only mode</span>
  <kbd>F11</kbd><span>or</span><kbd>Esc</kbd><span>to exit</span>
  <button type="button" class="displayonly-exit" data-action="exitDisplayOnly" aria-label="Exit display-only mode">Exit</button>
</div>

<!-- Every dialog is Preact and mounts here while open. -->
<div id="dialog-root"></div>

<!-- The console clients (noVNC, SPICE) and the xterm serial terminal are
     several hundred KB each and are needed only once a guest console opens,
     so app.js loads them on demand instead of blocking the first paint. -->
<script src="/van.js" defer></script>
<script src="/app.js" defer></script>
<script src="/ui.js" defer></script>
</body>
</html>
