<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hangar: VM Manager</title>
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/ui.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
<a id="skip-link" href="#main-content">Skip to main content</a>


<!-- Connection-lost banner, sidebar head, bulk bar, VM header, status bar and toasts are Preact,
     and so are the Console, Summary and Settings panels (mounted in #console-root, #summary-root and #settings-root). -->
<div id="banner-root" class="contents"></div>

<!-- ═══ Sidebar ═══ -->
<aside id="sidebar" class="displayonly:hidden" aria-label="VM Library">
  <div id="sidebar-head-root" class="contents"></div>
  <div id="vmlist" role="group" aria-label="VM Library">
    <div class="px-5 py-10 text-center">
      <p class="text-xs text-fg-dim">No VMs</p>
    </div>
  </div>
  <div id="bulk-root" class="contents"></div>
</aside>

<!-- ═══ Main Content ═══ -->
<main id="main-content" class="displayonly:col-span-full displayonly:row-span-full displayonly:flex displayonly:items-center displayonly:justify-center displayonly:bg-black displayonly:p-0" tabindex="-1">
  <h1 class="sr-only">Hangar VM Manager</h1>
  <!-- Toolbar -->
  <div id="toolbar-root" class="contents"></div>

  <!-- Content Area -->
  <div class="content-area displayonly:block displayonly:overflow-hidden displayonly:scrollbar-gutter-auto displayonly:p-0">
    <!-- VM header + tab bar -->
    <div id="vmheader-root" class="contents"></div>

    <!-- Tab: Console -->
    <div id="tabConsole" class="hidden displayonly:block!" role="tabpanel" aria-labelledby="tab-btn-console" aria-hidden="true">
      <div id="console-root" class="contents"></div>
    </div>

    <!-- Tab: Summary -->
    <div id="tabSummary" class="displayonly:hidden!" role="tabpanel" aria-labelledby="tab-btn-summary" aria-hidden="false">
      <div id="summary-root" class="contents"></div>
    </div>

    <!-- Tab: Settings (hidden) -->
    <div id="tabSettings" class="hidden displayonly:hidden!" role="tabpanel" aria-labelledby="tab-btn-settings" aria-hidden="true">
      <div id="settings-root" class="contents"></div>
    </div>

    <!-- Migration progress bar (Preact) -->
    <div id="mig_bar_container" class="displayonly:hidden"></div>
  </div>
</main>

<!-- Status bar and its screen-reader announcer -->
<div id="statusbar-root" class="contents"></div>

<!-- Toasts and the context menu. The toast container is the live region and mounts before any toast. -->
<div id="overlay-root"></div>

<!-- Display-only exit bar (Preact) -->
<div id="displayonly-root" class="contents"></div>

<!-- Every dialog is Preact and mounts here while open. -->
<div id="dialog-root"></div>

<!-- The console clients (noVNC, SPICE) and the xterm serial terminal are
     several hundred KB each and are needed only once a guest console opens,
     so app.js loads them on demand instead of blocking the first paint. -->
<script src="/app.js" defer></script>
<script src="/ui.js" defer></script>
</body>
</html>
